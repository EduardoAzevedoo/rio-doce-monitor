name: Monitor Rio Doce

on:
  schedule:
    # De hora em hora no minuto 41 (fora do pico do início da hora no GitHub).
    # Rodada completa (com previsão) a cada 3h, com rio ≥ 280 cm ou relatório pendente; nas demais, leve.
    - cron: "41 * * * *"
  push:
    # roda também quando o código muda (teste em produção); commits de dados não disparam
    branches: [main]
    paths: ["monitor/**", "modelos/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Enviar o relatório completo agora"
        type: boolean
        default: true
      teste_alerta:
        description: "Só enviar um ALERTA DE TESTE (para conferir o som com o celular no silencioso)"
        type: boolean
        default: false
      agendado:
        description: "Uso interno: chamada do agendador externo (cron-job.org), tratada como rodada agendada"
        type: boolean
        default: false

concurrency:
  group: monitor-rio-doce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HC_PING_URL: ${{ secrets.HC_PING_URL }}
      RUA_CM: ${{ vars.RUA_CM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o main mais recente (rodadas de push partiam de um commit antigo e davam conflito ao gravar)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Sinal de vida — início
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.teste_alerta) }}
        continue-on-error: true
        run: |
          [ -n "$HC_PING_URL" ] && curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL/start" || true

      - name: Alerta de teste
        if: github.event_name == 'workflow_dispatch' && inputs.teste_alerta
        run: python -m monitor.run --teste-alerta

      - name: Decidir rodada leve ou completa
        id: decidir
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.teste_alerta) }}
        env:
          AGENDADO: ${{ inputs.agendado }}
        run: python -m monitor.decidir

      - name: Instalar dependências
        if: steps.decidir.outputs.completo == 'true'
        run: pip install -r requirements.txt

      - name: Rodar monitor (completo)
        if: steps.decidir.outputs.completo == 'true'
        run: |
          python -m unittest -q
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.relatorio }}" = "true" ] && [ "${{ inputs.agendado }}" != "true" ]; then
            python -m monitor.run --relatorio
          else
            python -m monitor.run
          fi

      - name: Rodar monitor (leve)
        if: steps.decidir.outputs.completo == 'false'
        run: python -m monitor.run --leve

      - name: Sinal de vida — resultado
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.teste_alerta) }}
        continue-on-error: true
        run: |
          [ -z "$HC_PING_URL" ] && exit 0
          if [ "${{ job.status }}" != "success" ]; then
            motivo="execução do workflow falhou (status ${{ job.status }}, run ${{ github.run_id }})"
            sufixo="/fail"
          elif motivo=$(python -m monitor.saude); then
            sufixo=""
          else
            sufixo="/fail"
          fi
          echo "$sufixo $motivo"
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "$motivo" "$HC_PING_URL$sufixo" || true

      - name: Salvar estado e leituras
        if: always()
        run: |
          mkdir -p data
          echo "$(date +'%Y-%m-%dT%H:%M:%S'),${{ github.event_name }},agendado=${{ inputs.agendado }},run=${{ github.run_id }},tentativa=${{ github.run_attempt }},decidir=${{ steps.decidir.outcome }},completo=${{ steps.decidir.outputs.completo }},status_job=${{ job.status }}" >> data/execucoes.csv
          git config user.name "monitor-rio-doce"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "dados: $(date +'%d/%m %H:%M')" -q
            for i in 1 2 3; do
              if git pull --rebase -X theirs -q && git push -q; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
