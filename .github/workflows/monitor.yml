name: Monitor Rio Doce

on:
  schedule:
    # De hora em hora no minuto 41 (fora do pico do início da hora no GitHub).
    # Rodada completa (com previsão) a cada 3h, com rio ≥ 280 cm ou relatório pendente; nas demais, leve.
    - cron: "41 * * * *"
  push:
    # roda também quando o código muda (teste em produção); commits de dados não disparam
    branches: [main]
    paths: ["monitor/**", "modelos/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Enviar o relatório completo agora"
        type: boolean
        default: true
      teste_alerta:
        description: "Só enviar um ALERTA DE TESTE (para conferir o som com o celular no silencioso)"
        type: boolean
        default: false

concurrency:
  group: monitor-rio-doce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUA_CM: ${{ vars.RUA_CM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Alerta de teste
        if: github.event_name == 'workflow_dispatch' && inputs.teste_alerta
        run: python -m monitor.run --teste-alerta

      - name: Decidir rodada leve ou completa
        id: decidir
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.teste_alerta) }}
        run: python -m monitor.decidir

      - name: Instalar dependências
        if: steps.decidir.outputs.completo == 'true'
        run: pip install -r requirements.txt

      - name: Rodar monitor (completo)
        if: steps.decidir.outputs.completo == 'true'
        run: |
          python -m unittest -q
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.relatorio }}" = "true" ]; then
            python -m monitor.run --relatorio
          else
            python -m monitor.run
          fi

      - name: Rodar monitor (leve)
        if: steps.decidir.outputs.completo == 'false'
        run: python -m monitor.run --leve

      - name: Salvar estado e leituras
        if: always()
        run: |
          git config user.name "monitor-rio-doce"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "dados: $(date +'%d/%m %H:%M')" -q
            git pull --rebase -q && git push -q
          fi
