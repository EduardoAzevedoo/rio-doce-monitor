name: Monitor Rio Doce

on:
  schedule:
    # De hora em hora (minuto 23 para fugir do pico de :00 do GitHub). Relatório diário sai na 1ª rodada após 7h.
    - cron: "23 * * * *"
  push:
    # roda também quando o código muda (teste em produção); commits de dados não disparam
    branches: [main]
    paths: ["monitor/**", "modelos/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Enviar o relatório completo agora"
        type: boolean
        default: true

concurrency:
  group: monitor-rio-doce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUA_CM: ${{ vars.RUA_CM }}
        run: |
          python -m unittest -q
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.relatorio }}" = "true" ]; then
            python -m monitor.run --relatorio
          else
            python -m monitor.run
          fi

      - name: Salvar estado e leituras
        if: always()
        run: |
          git config user.name "monitor-rio-doce"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "dados: $(date +'%d/%m %H:%M')" -q
            git pull --rebase -q && git push -q
          fi
